<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkFlowy Date Publisher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            display: block;
        }
        .result.error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            display: block;
        }
        .result.loading {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            display: block;
        }
        .result-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .result-value {
            font-size: 24px;
            font-weight: bold;
            word-break: break-all;
        }
        .result.success .result-value {
            color: #2e7d32;
        }
        .result.error .result-value {
            color: #c62828;
        }
        .result.loading .result-value {
            color: #1565c0;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #2196f3;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .info code {
            background: #eee;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 WorkFlowy Date Publisher</h1>
        
        <div class="input-group">
            <label for="workflowyUrl">WorkFlowy Share URL</label>
            <input 
                type="text" 
                id="workflowyUrl" 
                placeholder="https://workflowy.com/s/xyz123..." 
                autocomplete="off"
            >
        </div>
        
        <button onclick="fetchAndPublish()">Fetch Date & Publish</button>
        
        <div id="result" class="result">
            <div class="result-label">Date Found</div>
            <div class="result-value" id="resultValue"></div>
        </div>
        
        <div class="info">
            <strong>How to use:</strong>
            <ol style="margin-left: 20px; margin-top: 10px;">
                <li>Share your WorkFlowy node publicly</li>
                <li>Copy the public share URL</li>
                <li>Paste it above and click "Fetch Date & Publish"</li>
                <li>The extracted date will be displayed</li>
            </ol>
        </div>
    </div>

    <script>
        // Get URL parameter if provided
        const params = new URLSearchParams(window.location.search);
        const urlParam = params.get('url');
        if (urlParam) {
            document.getElementById('workflowyUrl').value = decodeURIComponent(urlParam);
            // Optionally auto-fetch
            setTimeout(fetchAndPublish, 500);
        }

        async function fetchAndPublish() {
            const urlInput = document.getElementById('workflowyUrl').value.trim();
            const resultDiv = document.getElementById('result');
            const resultValue = document.getElementById('resultValue');

            if (!urlInput) {
                showError('Please enter a WorkFlowy URL');
                return;
            }

            // Validate URL
            if (!isValidWorkFlowyUrl(urlInput)) {
                showError('Please enter a valid WorkFlowy share URL');
                return;
            }

            showLoading('Fetching WorkFlowy data...');

            try {
                const date = await extractDateFromWorkFlowy(urlInput);
                
                if (date) {
                    showSuccess(date);
                    // Update page title and URL
                    document.title = `Date: ${date}`;
                    window.history.replaceState({}, '', `?url=${encodeURIComponent(urlInput)}`);
                } else {
                    showError('No date found in the WorkFlowy node');
                }
            } catch (error) {
                console.error('Error:', error);
                showError(`Error: ${error.message}`);
            }
        }

        function isValidWorkFlowyUrl(url) {
            return url.includes('workflowy.com') || 
                   url.includes('www.workflowy.com') ||
                   /^[a-zA-Z0-9\-_]{6,}$/.test(url); // Allow just the share ID
        }

        async function extractDateFromWorkFlowy(urlInput) {
            let url = urlInput;
            
            // Convert share ID to full URL if needed
            if (!url.startsWith('http')) {
                url = `https://workflowy.com/s/${url}`;
            }

            // Ensure proper share URL format
            if (!url.includes('/s/')) {
                url = url.replace('workflowy.com/', 'workflowy.com/s/');
            }

            try {
                // Try direct fetch first
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Unable to access WorkFlowy page`);
                }

                const html = await response.text();
                
                // Extract date from various common date formats
                const dates = extractDatesFromContent(html);
                
                if (dates.length > 0) {
                    // Return the first (most likely main) date found
                    return formatDate(dates[0]);
                }

                // If no dates found, try to extract from structured data
                const structuredDate = extractStructuredDate(html);
                if (structuredDate) {
                    return structuredDate;
                }

                return null;
            } catch (error) {
                // If CORS fails, try alternative approach
                if (error.message.includes('CORS') || error.message.includes('Failed to fetch')) {
                    return await fetchViaProxy(urlInput);
                }
                throw error;
            }
        }

        function extractDatesFromContent(html) {
            const datePatterns = [
                // ISO format: 2024-02-20
                /\b(\d{4})-(\d{2})-(\d{2})\b/g,
                // US format: 02/20/2024
                /\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/g,
                // Written format: February 20, 2024
                /\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),?\s+(\d{4})\b/gi,
                // Written format: 20 February 2024
                /\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{4})\b/gi,
                // Today/Tomorrow indicators with dates
                /\b(Today|Tomorrow)\s*[-:]?\s*(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})\b/gi,
            ];

            const dates = [];
            let matches;

            for (const pattern of datePatterns) {
                matches = html.matchAll(pattern);
                for (const match of matches) {
                    dates.push(match[0]);
                }
            }

            return dates;
        }

        function extractStructuredDate(html) {
            // Look for common date attribute patterns
            const patterns = [
                /data-date="([^"]+)"/i,
                /date="([^"]+)"/i,
                /<time[^>]*datetime="([^"]+)"/i,
                /"date":\s*"([^"]+)"/i,
            ];

            for (const pattern of patterns) {
                const match = html.match(pattern);
                if (match) {
                    return formatDate(match[1]);
                }
            }

            return null;
        }

        function formatDate(dateString) {
            try {
                // Try to parse the date
                const date = new Date(dateString);
                
                if (isNaN(date.getTime())) {
                    // If parsing fails, return the original string
                    return dateString.slice(0, 200); // Limit length
                }

                // Return formatted date
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch {
                return dateString.slice(0, 200);
            }
        }

        async function fetchViaProxy(urlInput) {
            // Fallback: Try CORS proxy if available
            let url = urlInput;
            if (!url.startsWith('http')) {
                url = `https://workflowy.com/s/${url}`;
            }

            const proxyUrl = `https://cors-anywhere.herokuapp.com/${url}`;
            
            try {
                const response = await fetch(proxyUrl);
                const html = await response.text();
                const dates = extractDatesFromContent(html);
                
                if (dates.length > 0) {
                    return formatDate(dates[0]);
                }
                
                return null;
            } catch {
                throw new Error('Unable to fetch data. Make sure the WorkFlowy share is public.');
            }
        }

        function showLoading(message) {
            const resultDiv = document.getElementById('result');
            const resultValue = document.getElementById('resultValue');
            
            resultDiv.className = 'result loading';
            resultValue.innerHTML = `<span class="spinner"></span>${message}`;
        }

        function showSuccess(value) {
            const resultDiv = document.getElementById('result');
            const resultValue = document.getElementById('resultValue');
            
            resultDiv.className = 'result success';
            resultValue.textContent = value;
        }

        function showError(message) {
            const resultDiv = document.getElementById('result');
            const resultValue = document.getElementById('resultValue');
            
            resultDiv.className = 'result error';
            resultValue.textContent = message;
        }

        // Allow Enter key to fetch
        document.getElementById('workflowyUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                fetchAndPublish();
            }
        });
    </script>
</body>
</html>
