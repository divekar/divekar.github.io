<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflowy Node Viewer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        ul { list-style-type: none; padding-left: 20px; }
        li { margin: 10px 0; position: relative; }
        li::before { content: "•"; color: #999; position: absolute; left: -15px; }
        .note { font-size: 0.9em; color: #666; display: block; margin-top: 4px; font-style: italic; }
        #loading { color: #007bff; }
    </style>
</head>
<body>

    <h1>Workflowy Content</h1>
    <div id="content">
        <p id="loading">Paste a shared Workflowy URL to begin...</p>
    </div>

    <script>
        // Example URL: https://workflowy.com/s/your-shared-id
        async function fetchWorkflowy(url) {
            const contentDiv = document.getElementById('content');
            
            try {
                // To bypass CORS (Cross-Origin Resource Sharing) blocks, 
                // we use a simple proxy to fetch the OPML data.
                const opmlUrl = url.endsWith('.opml') ? url : url + '.opml';
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(opmlUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                const outlines = xmlDoc.querySelectorAll('body > outline');

                contentDiv.innerHTML = ''; // Clear loading text
                renderOutlines(outlines, contentDiv);
                
            } catch (error) {
                contentDiv.innerHTML = `<p style="color:red">Error: Could not fetch data. Make sure the link is "Shared" and public.</p>`;
                console.error(error);
            }
        }

        function renderOutlines(outlines, container) {
            const ul = document.createElement('ul');
            outlines.forEach(outline => {
                const li = document.createElement('li');
                li.textContent = outline.getAttribute('text');
                
                // Check for notes
                const note = outline.getAttribute('_note');
                if (note) {
                    const noteSpan = document.createElement('span');
                    noteSpan.className = 'note';
                    noteSpan.textContent = note;
                    li.appendChild(noteSpan);
                }

                // Recursively handle children
                const children = outline.querySelectorAll(':scope > outline');
                if (children.length > 0) {
                    renderOutlines(children, li);
                }
                
                ul.appendChild(li);
            });
            container.appendChild(ul);
        }

        // AUTO-LOAD: Replace with your actual shared URL
        const mySharedUrl = 'YOUR_WORKFLOW_SHARED_URL_HERE';
        if (mySharedUrl !== 'YOUR_WORKFLOW_SHARED_URL_HERE') {
            fetchWorkflowy(mySharedUrl);
        }
    </script>
</body>
</html>
